[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"

# Formatter configuration (consistent across all profiles)
[fmt]
line_length = 80
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
